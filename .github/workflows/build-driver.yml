name: Build Discord TTS VB-CABLE Edition

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-driver.yml'
      - 'src/**'

jobs:
  build-app:
    name: Build discord_tts.exe
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: cmd
        run: dotnet restore "src\App\DiscordTtsMic.App.csproj"

      - name: Publish single-file Windows x64
        shell: cmd
        run: dotnet publish "src\App\DiscordTtsMic.App.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "artifacts\app"

      - name: Verify executable
        shell: cmd
        run: |
          if not exist "artifacts\app\discord_tts.exe" exit /b 1
          dir artifacts\app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: discord_tts-vbcable-win-x64
          path: artifacts/app/discord_tts.exe
          if-no-files-found: error
          retention-days: 14

name: Build Discord TTS Virtual Audio

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-driver.yml'
      - 'src/**'
      - 'cloud/**'

jobs:
  build:
    name: Windows x64 driver + app
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout Discord TTS source
        uses: actions/checkout@v4

      - name: Checkout Microsoft Windows driver samples
        uses: actions/checkout@v4
        with:
          repository: microsoft/Windows-driver-samples
          path: external/Windows-driver-samples
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Print toolchain versions
        shell: cmd
        run: |
          echo ==== OS ====
          ver
          echo ==== MSBuild ====
          msbuild -version
          echo ==== Installed Windows Kits ====
          dir "C:\Program Files (x86)\Windows Kits\10\bin" /b

      - name: Build Microsoft SysVAD baseline (Release x64)
        shell: cmd
        run: |
          msbuild "external\Windows-driver-samples\audio\sysvad\sysvad.sln" /m /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Collect SysVAD baseline outputs
        shell: cmd
        run: |
          if not exist artifacts\sysvad-baseline mkdir artifacts\sysvad-baseline
          for /r "external\Windows-driver-samples\audio\sysvad" %%F in (*.sys *.inf *.cat *.dll) do copy /y "%%F" artifacts\sysvad-baseline\ >nul
          dir artifacts\sysvad-baseline

      - name: Build portable app
        shell: cmd
        run: |
          dotnet restore "src\App\DiscordTtsMic.App.csproj"
          dotnet publish "src\App\DiscordTtsMic.App.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "artifacts\app"

      - name: Write build manifest
        shell: cmd
        run: |
          echo Discord TTS Microphone v3.1 Cloud Build> artifacts\BUILD_INFO.txt
          echo Runner: windows-2025>> artifacts\BUILD_INFO.txt
          echo SysVAD: Microsoft Windows-driver-samples main branch>> artifacts\BUILD_INFO.txt
          echo App: self-contained win-x64>> artifacts\BUILD_INFO.txt
          echo.>> artifacts\BUILD_INFO.txt
          echo NOTE: sysvad-baseline is the unmodified Microsoft baseline driver.>> artifacts\BUILD_INFO.txt
          echo It is intentionally NOT yet the final Discord TTS Virtual Microphone driver.>> artifacts\BUILD_INFO.txt

      - name: Upload SysVAD baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysvad-baseline-x64
          path: artifacts/sysvad-baseline/
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable app artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordTtsMic-app-win-x64
          path: artifacts/app/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: artifacts/BUILD_INFO.txt
          retention-days: 14
